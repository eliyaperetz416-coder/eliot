<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Demigod</title>
  <meta name="theme-color" content="#0a0b12">
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0b12;color:#f4f5fa;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
    h1{font-size:24px;margin:0 0 8px;color:#ffc43d} p{margin:0 0 20px;color:#b0b5cc;max-width:32ch}
    button{min-height:44px;padding:0 24px;border:0;border-radius:16px;background:#ffc43d;color:#1a1305;font:700 16px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1 id="t">You're offline</h1>
    <p id="b">Demigod needs to load once with a connection. After that it works anywhere in the gym.</p>
    <button id="r" onclick="location.href='./'">Try again</button>
  </main>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('he')) {
      document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl';
      t.textContent = 'אין חיבור';
      b.textContent = 'צריך לטעון את Demigod פעם אחת עם אינטרנט. אחרי זה הוא עובד בכל מקום בחדר הכושר.';
      r.textContent = 'ניסיון נוסף';
    }
  </script>
</body>
</html>
